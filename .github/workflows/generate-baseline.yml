name: Generate Prisma baseline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/cloudie_ci
    steps:
      - uses: actions/checkout@v4
      - name: Check baseline
        id: baseline
        run: |
          if [ -f prisma/migrations/0_init/migration.sql ]; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.baseline.outputs.missing == 'true'
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        if: steps.baseline.outputs.missing == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.baseline.outputs.missing == 'true'
      - run: pnpm exec prisma validate
        if: steps.baseline.outputs.missing == 'true'
      - run: mkdir -p prisma/migrations/0_init
        if: steps.baseline.outputs.missing == 'true'
      - run: pnpm exec prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/0_init/migration.sql
        if: steps.baseline.outputs.missing == 'true'
      - run: test -s prisma/migrations/0_init/migration.sql
        if: steps.baseline.outputs.missing == 'true'
      - name: Commit baseline migration
        if: steps.baseline.outputs.missing == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations/0_init/migration.sql
          git diff --cached --quiet || git commit -m "chore(prisma): add production baseline migration"
          git push
