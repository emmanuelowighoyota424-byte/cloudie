name: Generate Prisma baseline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    if: ${{ !hashFiles('prisma/migrations/0_init/migration.sql') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate
      - run: mkdir -p prisma/migrations/0_init
      - run: pnpm exec prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script > prisma/migrations/0_init/migration.sql
      - run: test -s prisma/migrations/0_init/migration.sql
      - name: Commit baseline migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations/0_init/migration.sql
          git diff --cached --quiet || git commit -m "chore(prisma): add production baseline migration"
          git push
