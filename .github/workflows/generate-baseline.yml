name: Generate Prisma baseline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check baseline
        id: baseline
        continue-on-error: true
        run: test -f prisma/migrations/0_init/migration.sql
      - uses: pnpm/action-setup@v4
        if: steps.baseline.outcome == 'failure'
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        if: steps.baseline.outcome == 'failure'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.baseline.outcome == 'failure'
      - run: pnpm exec prisma validate
        if: steps.baseline.outcome == 'failure'
      - run: mkdir -p prisma/migrations/0_init
        if: steps.baseline.outcome == 'failure'
      - run: pnpm exec prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/0_init/migration.sql
        if: steps.baseline.outcome == 'failure'
      - run: test -s prisma/migrations/0_init/migration.sql
        if: steps.baseline.outcome == 'failure'
      - name: Commit baseline migration
        if: steps.baseline.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations/0_init/migration.sql
          git diff --cached --quiet || git commit -m "chore(prisma): add production baseline migration"
          git push
